<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GO PRACHI LABS</title>
<style>
  :root{ --bg:#0f141a; --fg:#e6edf3; --muted:#9aa7b4; --accent:#5b93f5; --card:#151b22; --line:#242c36; }
  @media (prefers-color-scheme:light){ :root{ --bg:#ffffff; --fg:#1c2530; --muted:#5c6773; --accent:#2563eb; --card:#f7f9fc; --line:#e6eaf0; } }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; line-height:1.6; }
  .wrap{ max-width:560px; }
  .logo{ width:76px; height:76px; border-radius:20px; background:linear-gradient(135deg,#2563eb,#5b93f5);
    display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:34px; }
  h1{ font-size:30px; margin:0 0 6px; letter-spacing:.3px; }
  .tag{ color:var(--muted); font-size:16px; margin:0 0 28px; }
  .app{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin:0 0 24px; }
  .app h2{ font-size:18px; margin:0 0 4px; }
  .app p{ color:var(--muted); font-size:14px; margin:0 0 14px; }
  a.btn{ display:inline-block; background:var(--accent); color:#fff; text-decoration:none; padding:10px 18px; border-radius:10px; font-size:14px; }
  nav{ margin-top:8px; font-size:14px; }
  nav a{ color:var(--accent); text-decoration:none; margin:0 10px; }
  nav a:hover{ text-decoration:underline; }
  footer{ color:var(--muted); font-size:13px; margin-top:26px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">🧭</div>
    <h1>GO PRACHI LABS</h1>
    <p class="tag">Practical mobile tools for everyday life.</p>

    <div class="app">
      <h2>GPS Map Camera &amp; Compass</h2>
      <p>Geotag photos with location, address, maps, compass, and sun &amp; moon details.</p>
      <a class="btn" href="https://play.google.com/store/apps/details?id=compass.photo.camera.map.gps.gpsmapcamera_compass" target="_blank" rel="noopener">Get it on Google Play</a>
    </div>

    <nav>
      <a href="https://legal.goprachilabs.com/privacy-policy.html">Privacy Policy</a>
      <a href="https://legal.goprachilabs.com/terms-of-service.html">Terms of Service</a>
      <a href="mailto:goprachilabs@gmail.com">Contact</a>
    </nav>

    <footer>© 2026 GO PRACHI LABS. All rights reserved.</footer>
  </div>
</body>
</html>
